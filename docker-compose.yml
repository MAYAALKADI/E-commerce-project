services:
  mysql-primary:
    image: mariadb:10.11
    command:
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: storedb
      MARIADB_USER: store
      MARIADB_PASSWORD: storepass
    ports:
      - "3307:3306"
    volumes:
      - mysql-primary-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  mysql-replica:
    image: mariadb:10.11
    command:
      - --server-id=2
      - --relay-log=relay-bin
      - --read-only=1
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: storedb
      MARIADB_USER: store
      MARIADB_PASSWORD: storepass
    ports:
      - "3308:3306"
    volumes:
      - mysql-replica-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      mysql-primary:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  inventory-service:
    build: ./inventory-service
    ports:
      - "9090:9090"
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/inventory-db
    volumes:
      - inventory-data:/data

  store:
    build: .
    ports:
      - "8080:8080"
    environment:
      INVENTORY_GRPC_HOST: inventory-service
      SPRING_DATASOURCE_URL: jdbc:mariadb://mysql-primary:3306/storedb
      SPRING_DATASOURCE_USERNAME: store
      SPRING_DATASOURCE_PASSWORD: storepass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.mariadb.jdbc.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.MariaDBDialect
      SEED_ENABLED: "false"
      REPLICA_DATASOURCE_URL: jdbc:mariadb://mysql-replica:3306/storedb
      REPLICA_DATASOURCE_USERNAME: store
      REPLICA_DATASOURCE_PASSWORD: storepass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
    depends_on:
      mysql-primary:
        condition: service_healthy
      inventory-service:
        condition: service_started
      redis:
        condition: service_healthy

volumes:
  inventory-data:
  mysql-primary-data:
  mysql-replica-data: