services:
  inventory-service:
    build: ./inventory-service
    ports:
      - "9090:9090"
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:file:/data/inventory-db
    volumes:
      - inventory-data:/data

  store:
    build: .
    ports:
      - "8080:8080"
    environment:
      INVENTORY_GRPC_HOST: inventory-service
    depends_on:
      - inventory-service

volumes:
  inventory-data: