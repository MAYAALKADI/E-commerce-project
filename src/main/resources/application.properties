spring.application.name=store-project
spring.datasource.url=jdbc:h2:mem:storedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

inventory.grpc.host=localhost
inventory.grpc.port=9090
inventory.grpc.deadline-seconds=3

spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true

replica.datasource.url=${REPLICA_DATASOURCE_URL:${spring.datasource.url}}
replica.datasource.username=${REPLICA_DATASOURCE_USERNAME:${spring.datasource.username}}
replica.datasource.password=${REPLICA_DATASOURCE_PASSWORD:${spring.datasource.password}}

spring.cache.type=redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}